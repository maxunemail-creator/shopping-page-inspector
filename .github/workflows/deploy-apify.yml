name: Deploy to Apify

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Run the live JD acceptance sample after deployment'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-apify-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify
        run: |
          npm install
          npm run check
          npm test

      - name: Push Actor to Apify
        id: apify
        uses: apify/push-actor-action@master
        with:
          token: ${{ secrets.APIFY_TOKEN }}

      - name: Run live JD acceptance sample
        id: smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
        continue-on-error: true
        shell: bash
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: qIrlxzbplFdbhayua
        run: |
          set -u
          mkdir -p apify-results
          auth=(-H "Authorization: Bearer ${APIFY_TOKEN}")
          json=(-H "Content-Type: application/json")
          curl --fail-with-body -sS -X POST \
            "https://api.apify.com/v2/actors/${APIFY_ACTOR_ID}/runs?waitForFinish=60" \
            "${auth[@]}" "${json[@]}" \
            --data-binary @sample-input.json \
            -o apify-results/run-response.json
          RUN_ID=$(jq -r '.data.id // empty' apify-results/run-response.json)
          RUN_STATUS=$(jq -r '.data.status // empty' apify-results/run-response.json)
          if [ -z "$RUN_ID" ]; then
            cat apify-results/run-response.json
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4; do
            case "$RUN_STATUS" in SUCCEEDED|FAILED|TIMED-OUT|ABORTED) break;; esac
            curl --fail-with-body -sS \
              "https://api.apify.com/v2/actor-runs/${RUN_ID}?waitForFinish=60" \
              "${auth[@]}" -o apify-results/run-response.json
            RUN_STATUS=$(jq -r '.data.status // empty' apify-results/run-response.json)
          done
          echo "run-status=$RUN_STATUS" >> "$GITHUB_OUTPUT"
          KVS_ID=$(jq -r '.data.defaultKeyValueStoreId // empty' apify-results/run-response.json)
          DATASET_ID=$(jq -r '.data.defaultDatasetId // empty' apify-results/run-response.json)
          echo "kvs-id=$KVS_ID" >> "$GITHUB_OUTPUT"
          echo "dataset-id=$DATASET_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$DATASET_ID" ]; then
            curl -fsS "https://api.apify.com/v2/datasets/${DATASET_ID}/items?clean=true&format=json" \
              "${auth[@]}" -o apify-results/DATASET.json || true
          fi
          if [ -n "$KVS_ID" ]; then
            curl -fsS "https://api.apify.com/v2/key-value-stores/${KVS_ID}/keys?limit=1000" \
              "${auth[@]}" -o apify-results/KV_KEYS.json || true
            for key in OUTPUT STRUCTURED.json STRUCT_IMAGE_MANIFEST.json JD_DESCRIPTION.json JD_DESCRIPTION_RAW.txt PAGE.html PAGE.png VISIBLE_TEXT.txt IMAGES.json JSON_LD.json RESOURCES.json NETWORK_JSON.json DETAIL_MANIFEST.json; do
              encoded=$(jq -rn --arg s "$key" '$s|@uri')
              dest="$key"; [ "$key" = OUTPUT ] && dest=OUTPUT.json
              curl -fsS "https://api.apify.com/v2/key-value-stores/${KVS_ID}/records/${encoded}" \
                "${auth[@]}" -o "apify-results/${dest}" || true
            done
            if [ -s apify-results/KV_KEYS.json ]; then
              jq -r '.data.items[]?.key // empty' apify-results/KV_KEYS.json \
                | grep -E '^(DETAIL_|STRUCT_IMAGE_|JD_DETAIL_)' || true \
                | while IFS= read -r key; do
                    [ -z "$key" ] && continue
                    encoded=$(jq -rn --arg s "$key" '$s|@uri')
                    curl -fsS "https://api.apify.com/v2/key-value-stores/${KVS_ID}/records/${encoded}" \
                      "${auth[@]}" -o "apify-results/${key}" || true
                  done
            fi
          fi
          test "$RUN_STATUS" = SUCCEEDED

      - name: Upload acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_smoke
        uses: actions/upload-artifact@v4
        with:
          name: jd-acceptance-${{ github.run_id }}
          path: apify-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Record deployment status
        if: always()
        shell: bash
        run: |
          cat > .github/deploy-status.json <<'EOF'
          {
            "workflow_run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "apify_outcome": "${{ steps.apify.outcome }}",
            "apify_build_id": "${{ steps.apify.outputs.build-id }}",
            "apify_build_number": "${{ steps.apify.outputs.build-number }}",
            "apify_build_status": "${{ steps.apify.outputs.build-status }}",
            "smoke_requested": "${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}",
            "smoke_outcome": "${{ steps.smoke.outcome }}",
            "smoke_run_id": "${{ steps.smoke.outputs.run-id }}",
            "smoke_run_status": "${{ steps.smoke.outputs.run-status }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-status.json
          git commit -m "chore: record Apify deployment status [skip deploy]" || true
          git push || true

      - name: Fail on deployment failure
        if: always()
        shell: bash
        run: |
          test "${{ steps.apify.outcome }}" = "success"
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}" = "true" ]; then
            test "${{ steps.smoke.outcome }}" = "success"
          fi
